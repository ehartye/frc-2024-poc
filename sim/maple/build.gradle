plugins {
 id 'java'
 id 'application'
 id 'edu.wpi.first.GradleRIO' version '2026.2.1'
}
java { sourceCompatibility=JavaVersion.VERSION_17; targetCompatibility=JavaVersion.VERSION_17 }
repositories { mavenCentral(); maven { url 'https://frcmaven.wpi.edu/artifactory/release/' } }
def mapleSource=providers.gradleProperty('mapleSource').get()
sourceSets.main.java.srcDir("${mapleSource}/project/src/main/java")
dependencies {
 implementation wpi.java.deps.wpilib()
 implementation 'org.dyn4j:dyn4j:5.0.2'
 nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
 simulationRelease wpi.sim.enableRelease()
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass='frc.maplearena.ArenaHarness' }
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)
test { useJUnitPlatform(); maxParallelForks=1; testLogging { events 'passed','failed'; exceptionFormat='full' } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
