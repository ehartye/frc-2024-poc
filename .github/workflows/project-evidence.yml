name: Project evidence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Require the owner-selected project checks revision
        env:
          PIN: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
        run: '[[ "$PIN" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
          path: plugin
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: project/tests/requirements-ci.txt
      - name: Install the evidence dependencies
        run: 'python -m pip install --only-binary=:all: -r project/tests/requirements-ci.txt'
      - name: Run the local project checks
        env:
          AGENT_FRC_PLUGIN_ROOT: ${{ github.workspace }}/plugin
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git -C project merge-base --is-ancestor "$BASE" HEAD; then
            node plugin/scripts/project-checks.mjs project full
          else
            node plugin/scripts/project-checks.mjs project changed "$BASE"
          fi
