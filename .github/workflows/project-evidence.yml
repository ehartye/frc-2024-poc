name: Project evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Check out the layout validator
        uses: actions/checkout@v4
        with:
          repository: ehartye/agent-frc
          ref: 6670cb44e3e3f35ae82309d86d18dcb4c069682e
          path: .layout-validator
          persist-credentials: false
      - name: Verify student project layout and Fusion handoff
        run: node ../.layout-validator/scripts/project-layout.mjs check .

      - name: Verify CAD views and README coverage
        run: python scripts/cad-readmes.py . --template scripts/cad-orbit.html

      - name: Verify installed swerve display assemblies
        run: python -m unittest discover -s tests -p 'test_showcase*.py'

      - name: Reproduce the Stage rehearsal and check the public climber evidence
        run: |
          node ../.layout-validator/scripts/rehearsal-series.mjs kickoff/crescendo-field.json "$RUNNER_TEMP/stage-series.json"
          cmp "$RUNNER_TEMP/stage-series.json" experiments/speaker-cycles/match-series.json
          node ../.layout-validator/scripts/kickoff.mjs --profile kickoff/crescendo-field.json --output "$RUNNER_TEMP/field-lab.html"
          cmp "$RUNNER_TEMP/field-lab.html" docs/field-lab.html
          python tests/test_stage_endgame.py

      - name: Verify the R9 mechanical handoff and native bill
        run: |
          node ../.layout-validator/scripts/assembly-accounting.mjs cad/assembly-readiness/mass/mapping.json > "$RUNNER_TEMP/r9-mass.json"
          R9_CHECKED_MASS="$RUNNER_TEMP/r9-mass.json" python tests/test_r9_physical_assembly.py

      - name: Verify the isolated passive service fixture and rejected bracket layout
        run: python tests/test_passive_service.py

      - name: Check source-bound field roles, service limits and load evidence
        run: python experiments/alliance-service/evaluate.py --check
