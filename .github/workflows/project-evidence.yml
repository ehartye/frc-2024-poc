name: Project evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Check out the layout validator
        uses: actions/checkout@v4
        with:
          repository: ehartye/agent-frc
          ref: 6670cb44e3e3f35ae82309d86d18dcb4c069682e
          path: .layout-validator
          persist-credentials: false
      - name: Verify student project layout and Fusion handoff
        run: node ../.layout-validator/scripts/project-layout.mjs check .

      - name: Verify CAD views and README coverage
        run: python scripts/cad-readmes.py . --template scripts/cad-orbit.html

      - name: Verify installed swerve display assemblies
        run: python -m unittest discover -s tests -p 'test_showcase*.py'

      - name: Reproduce the Stage rehearsal and check the public climber evidence
        run: |
          node ../.layout-validator/scripts/rehearsal-series.mjs kickoff/crescendo-field.json "$RUNNER_TEMP/stage-series.json"
          cmp "$RUNNER_TEMP/stage-series.json" experiments/speaker-cycles/match-series.json
          python tests/test_stage_endgame.py

      - name: Check out the physical match generator
        uses: actions/checkout@v4
        with:
          repository: ehartye/agent-frc
          ref: 92ddf41933dd6026b26493c1d2c91505e9d15914
          path: .physical-match
          persist-credentials: false
      - name: Reproduce all six roles, finite stock, human service and student controls
        run: |
          node ../.physical-match/scripts/rehearsal-series.mjs kickoff/physical-match.json "$RUNNER_TEMP/physical-series.json"
          cmp "$RUNNER_TEMP/physical-series.json" experiments/physical-match/series.json
          node ../.physical-match/scripts/strategy-lab.mjs kickoff/physical-match.json experiments/physical-match/roles.json --html "$RUNNER_TEMP/physical-lab.html" > "$RUNNER_TEMP/physical-roles.json"
          python experiments/physical-match/publish.py "$RUNNER_TEMP/physical-lab.html"
          cmp "$RUNNER_TEMP/physical-lab.html" docs/field-lab.html
          python -B tests/test_physical_match.py

      - name: Verify the R9 mechanical handoff and native bill
        run: |
          node ../.layout-validator/scripts/assembly-accounting.mjs cad/assembly-readiness/mass/mapping.json > "$RUNNER_TEMP/r9-mass.json"
          R9_CHECKED_MASS="$RUNNER_TEMP/r9-mass.json" python tests/test_r9_physical_assembly.py

      - name: Verify the isolated passive service fixture and rejected bracket layout
        run: python tests/test_passive_service.py

      - name: Replay the matched passive frame stiffness study
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -m pip install --only-binary=:all: --target "$RUNNER_TEMP/frame-model" numpy==2.3.5
          PYTHONPATH="$RUNNER_TEMP/frame-model" python tests/test_frame_stiffness.py

      - name: Check out the season review tools
        uses: actions/checkout@v4
        with:
          repository: ehartye/agent-frc
          ref: 344fac71aa4aecbec66cf4015c7646b1149a542b
          path: .season-review
          persist-credentials: false
      - name: Replay field roles, service limits and single-saddle evidence
        run: |
          python experiments/alliance-service/replay.py ../.season-review/scripts
          git diff --exit-code -- experiments/alliance-service
      - name: Check out the spatial equilibrium checker
        uses: actions/checkout@v4
        with:
          repository: ehartye/agent-frc
          ref: d508f4bcb5d02edfea8766f8839628310564192c
          path: .spatial-checker
          persist-credentials: false
      - name: Reproduce the separate R8 spatial saddle result
        run: |
          node experiments/alliance-service/spatial-saddle.mjs ../.spatial-checker/scripts > "$RUNNER_TEMP/spatial-saddle.json"
          cmp "$RUNNER_TEMP/spatial-saddle.json" experiments/alliance-service/spatial-saddle.json

      - name: Check out the ground relay cohort reader
        uses: actions/checkout@v4
        with:
          repository: ehartye/agent-frc
          ref: 687618cdeedaca33ba8271e1aab4b7ce2697b805
          path: .ground-cohort
          persist-credentials: false
      - name: Replay custody, peer occupancy, clock, held-out cases and public lab
        run: |
          python -B experiments/ground-relay/replay.py ../.ground-cohort/scripts
          python -B tests/test_ground_relay.py
          git diff --exit-code -- experiments/ground-relay docs/ground-relay.json

      - name: Reproduce the registered ground contacts, custody sequence and lab
        run: |
          export PYTHONPATH="$RUNNER_TEMP/frame-model"
          export OPENBLAS_NUM_THREADS=1
          python -B experiments/registered-custody/contact.py
          python -B experiments/registered-custody/loads.py
          python -B experiments/registered-custody/rehearse.py
          python -B experiments/registered-custody/lab.py
          python -B tests/test_registered_custody.py
          git diff --exit-code -- experiments/registered-custody docs/ground-contact.json

      - name: Replay the passive cassette and audit the displayed robot revisions
        run: |
          export PYTHONPATH="$RUNNER_TEMP/frame-model"
          python -B tests/test_passive_entry.py
          python -B experiments/passive-entry/replay.py
          python -B tests/test_passive_entry.py
          git diff --exit-code -- experiments/passive-entry/showcase-audit.json experiments/passive-entry/service.json
