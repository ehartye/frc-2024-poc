name: Mechanical model eligibility
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mechanical-model-eligibility:
    name: Mechanical model eligibility
    runs-on: ubuntu-latest
    env:
      APPROVED_COMMIT: ${{ vars.FRC_APPROVED_MODEL_COMMIT }}
      VERIFIER_COMMIT: ${{ vars.FRC_MODEL_VERIFIER_COMMIT }}
      REVIEWER_KEY: ${{ vars.FRC_MODEL_REVIEWER_PUBLIC_KEY }}
    steps:
      - name: Require owner-pinned revisions
        shell: bash
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the proposed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the first-party verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.FRC_MODEL_VERIFIER_COMMIT }}
          path: verifier
          persist-credentials: false
      - name: Check out the field generator used by Project evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ehartye/agent-frc
          ref: 92ddf41933dd6026b26493c1d2c91505e9d15914
          path: field-generator
          persist-credentials: false
      - name: Audit the merge sources and the complete legacy Pages directory
        shell: bash
        run: |
          test "$(git -C project rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C verifier rev-parse HEAD)" = "$VERIFIER_COMMIT"
          test "$(git -C field-generator rev-parse HEAD)" = 92ddf41933dd6026b26493c1d2c91505e9d15914
          git -C project merge-base --is-ancestor "$APPROVED_COMMIT" HEAD
          git -C project show "$APPROVED_COMMIT:.github/mechanical/check-merge.py" > "$RUNNER_TEMP/check-merge.py"
          python3 -I "$RUNNER_TEMP/check-merge.py" project "$APPROVED_COMMIT" verifier field-generator
